<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Maker</title>
    <!-- Set the color theme before the first paint so there's no flash: use the
         saved choice if there is one, otherwise follow the OS preference. -->
    <script>
      try {
        var saved = localStorage.getItem('iwide-theme')
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
        // Student-chosen colors for the bars, Files sidebar and Problems/Console
        // area (see src/ui/toolbar-color.js), also before first paint.
        var zones = { toolbar: 'iwide-toolbar-color', sidebar: 'iwide-sidebar-color', panel: 'iwide-panel-color' }
        var lin = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4) }
        for (var zone in zones) {
          var hex = localStorage.getItem(zones[zone])
          if (hex && /^#[0-9a-f]{6}$/.test(hex)) {
            var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16)
            var L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b)
            document.documentElement.style.setProperty('--' + zone + '-bg', hex)
            document.documentElement.style.setProperty('--' + zone + '-text', L > 0.4 ? '#1c2530' : '#ffffff')
          }
        }
        // Remembered collapsed state for the Files sidebar and Problems/Console
        // panel (see src/ui/collapse.js), applied before first paint.
        if (localStorage.getItem('iwide-sidebar-collapsed') === '1') document.documentElement.classList.add('sidebar-collapsed')
        if (localStorage.getItem('iwide-panel-collapsed') === '1') document.documentElement.classList.add('panel-collapsed')
      } catch (e) { /* localStorage/matchMedia unavailable — default to light */ }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Top menu bar -->
      <header id="menubar">
        <span class="brand">Website&nbsp;Maker</span>
        <div class="menu-actions">
          <button id="btn-new-file" title="Add a new file to this site">+ New file</button>
          <button id="btn-add-image" title="Add a picture from your computer to the images folder">Add image…</button>
          <button id="btn-add-audio" title="Add a small sound file from your computer to the audio folder">Add audio…</button>
          <button id="btn-import" title="Open a folder from your computer">Import folder…</button>
          <button id="btn-export" title="Download your whole site as a .zip">Export .zip</button>
          <button id="btn-projects" title="Switch between your sites">Projects ▾</button>
          <button id="btn-toolbar-color" title="Pick colors for the bars, Files sidebar and Problems/Console area with hex codes">🎨 Colors</button>
          <button id="btn-theme" title="Switch between light and dark mode" aria-pressed="false"></button>
          <span id="save-status" class="save-status" title="Your work saves automatically in the browser - but still download it as a zip!">Saved</span>
          <span id="persist-badge" class="persist-badge" hidden></span>
        </div>
      </header>

      <!-- Main three-pane area -->
      <main id="workbench">
        <aside id="sidebar">
          <div class="pane-title sidebar-title">
            <span class="sidebar-title-text">Files</span>
            <button class="collapse-btn" data-collapse="sidebar" aria-expanded="true">◂</button>
          </div>
          <ul id="file-tree" class="file-tree"></ul>
        </aside>

        <section id="editor-region">
          <div id="tabs" class="tabs"></div>
          <div id="editor-host" class="editor-host"></div>
        </section>

        <section id="preview-region">
          <div class="preview-toolbar">
            <span class="pane-title">Live Preview</span>
            <label class="preview-page-label">
              You're looking at:
              <select id="preview-page"></select>
            </label>
            <button id="btn-refresh-preview" title="Reload the preview">↻</button>
          </div>
          <iframe
            id="preview-frame"
            class="preview-frame"
            title="Live preview of your website"
            sandbox="allow-scripts allow-modals allow-popups allow-forms"
          ></iframe>
        </section>
      </main>

      <!-- Bottom panel: Problems + Console tabs -->
      <footer id="bottom-panel">
        <div class="bottom-tabs">
          <button class="bottom-tab is-active" data-panel="problems">
            Problems <span id="problems-count" class="badge">0</span>
          </button>
          <button class="bottom-tab" data-panel="console">
            Console <span id="console-count" class="badge">0</span>
          </button>
          <button id="btn-clear-console" class="clear-btn" title="Clear the console">Clear</button>
          <button class="collapse-btn" data-collapse="panel" aria-expanded="true">▾</button>
        </div>
        <div id="problems-panel" class="bottom-body is-active"></div>
        <div id="console-panel" class="bottom-body"></div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
